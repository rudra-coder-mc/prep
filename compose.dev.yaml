# Authoring profile. Overlays compose.yaml with hot reload so editing a lesson
# or a component does not require rebuilding the image.
#
#   docker compose -f compose.yaml -f compose.dev.yaml up

services:
  app:
    image: prep-app-dev
    build:
      target: dev
    command: ['npm', 'run', 'dev', '--', '--hostname', '0.0.0.0']
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages/core/src:/app/packages/core/src
      - ./packages/content/src:/app/packages/content/src
      - ./packages/content/content:/app/packages/content/content
