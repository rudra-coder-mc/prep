name: prep

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prep}
      POSTGRES_DB: ${POSTGRES_DB:-prep}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-prep} -d ${POSTGRES_DB:-prep}']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Piper neural text to speech, used to narrate a topic and to read a question
  # out. The voice model is baked into the image, so this container needs no
  # network and no setup.
  #
  # Behind a profile, and the server turns the profile on: `scripts/deploy.sh`
  # starts the stack with `--profile speech`, so the machine that serves the app
  # always has a voice and every play button works. A laptop still gets the app
  # and the database alone, and the commands that need speech start this
  # themselves. See
  # docs/decisions/0029-audio-is-synthesised-when-it-is-asked-for.md.
  #
  # A cache entry is addressed by the words in the script and not by the voice,
  # so changing PIPER_VOICE means rebuilding this image *and* deleting
  # .speech-cache, or old lines keep playing in the old voice. See
  # docs/decisions/0015-piper-narration-engine.md.
  tts:
    image: prep-tts
    build:
      context: ./services/tts
    profiles: ['speech']
    # Part of the stack on the server, so it comes back after a reboot the way
    # the app does. On a laptop the scripts stop it by hand on their way out,
    # and compose does not restart a container that was stopped deliberately.
    restart: unless-stopped
    # Started and stopped around every command that records, so it should go
    # down promptly and cleanly. As PID 1 the process only sees signals it
    # installs a handler for, and Python installs one for SIGINT, not SIGTERM.
    # Sending the one it handles is what makes a stop take a moment rather than
    # the full grace period and a kill.
    stop_signal: SIGINT
    stop_grace_period: 5s
    ports:
      # The scripts that record narration reach it here. The app reaches the
      # container over the compose network.
      - '${TTS_PORT:-5001}:5000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/info').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      # The voice model loads before Flask starts serving.
      start_period: 30s

  app:
    # Named explicitly so the development profile cannot reuse this image.
    image: prep-app
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-prep}:${POSTGRES_PASSWORD:-prep}@db:5432/${POSTGRES_DB:-prep}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-insecure-development-secret-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-dev@prep.test}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-dev}
      SPEECH_SERVICE_URL: ${SPEECH_SERVICE_URL:-http://tts:5000}
      SPEECH_CACHE_DIR: /cache/speech
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      # The same directory `npm run narration:build` writes into, not a named
      # volume. The build runs on the host and the app reads what it made, so
      # there is one place recordings live rather than two that have to be kept
      # in step. See docs/decisions/0022-one-place-for-recordings.md.
      - ./.speech-cache:/cache/speech
    # The database is the only thing that gates startup. The speech engine is
    # not in the default set and is not needed to serve a page: a recording is
    # asked for after the app is up, and a request that arrives before the voice
    # model has loaded says the voice is unavailable rather than failing to
    # start anything.
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
