name: prep

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prep}
      POSTGRES_DB: ${POSTGRES_DB:-prep}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-prep} -d ${POSTGRES_DB:-prep}']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Piper neural text to speech, used to narrate a topic. The voice model is
  # baked into the image, so this container needs no network and no setup.
  #
  # Behind a profile, so `docker compose up` does not start it. Narration is
  # built ahead of time by `npm run narration:build`, which starts this, records
  # what has no recording yet, and stops it again. A voice model sitting in
  # memory to serve nothing is the load this avoids. See
  # docs/decisions/0020-the-speech-engine-runs-on-demand.md.
  #
  # A cache entry is addressed by the words in the script and not by the voice,
  # so changing PIPER_VOICE means rebuilding this image *and* discarding the
  # speech-cache volume, or old lines keep playing in the old voice. See
  # docs/decisions/0015-piper-narration-engine.md.
  tts:
    image: prep-tts
    build:
      context: ./services/tts
    profiles: ['speech']
    # A tool rather than a service, so nothing should bring it back by itself.
    restart: 'no'
    # Stopped after every recording session, so it should go down promptly and
    # cleanly. As PID 1 the process only sees signals it installs a handler for,
    # and Python installs one for SIGINT, not SIGTERM. Sending the one it
    # handles is what makes a stop take a moment rather than the full grace
    # period and a kill.
    stop_signal: SIGINT
    stop_grace_period: 5s
    ports:
      # The scripts that record narration reach it here. The app reaches the
      # container over the compose network, on the rare occasions it is up.
      - '${TTS_PORT:-5001}:5000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/info').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      # The voice model loads before Flask starts serving.
      start_period: 30s

  app:
    # Named explicitly so the development profile cannot reuse this image.
    image: prep-app
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-prep}:${POSTGRES_PASSWORD:-prep}@db:5432/${POSTGRES_DB:-prep}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-insecure-development-secret-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-dev@prep.test}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-dev}
      SPEECH_SERVICE_URL: ${SPEECH_SERVICE_URL:-http://tts:5000}
      SPEECH_CACHE_DIR: /cache/speech
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - speech-cache:/cache/speech
    # The database is the only thing that gates startup, and the only other
    # container in the default set. The speech engine is not running at all
    # under normal use, and the app does not need it to be: every narration
    # script in content/ already has a recording in this volume.
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  speech-cache:
